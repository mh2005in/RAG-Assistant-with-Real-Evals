# Mocked Playwright E2E for the Angular frontend. Offline and backend-free (the
# API is stubbed in-browser), so it runs on every PR that touches the frontend.
# The full-stack E2E suite is not run here -- it needs the Compose stack and is
# run by the deploy-verify agent instead (see .claude/agents/deploy-verify.md).
name: frontend-e2e

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-e2e.yml"

jobs:
  mocked-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
