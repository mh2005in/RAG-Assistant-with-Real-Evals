# nginx server for the RAG Assistant frontend.
#
# Two jobs:
#   1. Serve the compiled Angular SPA, falling back to index.html so client-side
#      routes (/user, /admin) resolve on a full-page load / refresh.
#   2. Reverse-proxy the backend API paths to the app service over the compose
#      network, so the browser sees a single origin and needs no CORS config
#      (this is what API_BASE='' in the app expects).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PDF uploads flow through /process; lift nginx's 1 MB default so they are
    # not rejected with 413 before reaching the backend.
    client_max_body_size 50m;

    # Resolve the app service through Docker's embedded DNS at request time. With
    # a variable upstream (below) nginx does NOT resolve the name at startup, so
    # the container starts even before app is up, and it re-resolves rather than
    # pinning a stale IP if app restarts.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # The four backend endpoints. Regex locations take precedence over the SPA
    # fallback below, so these are proxied rather than served as static files.
    location ~ ^/(process|evaluate|retrieve|answer)$ {
        set $upstream app;
        proxy_pass http://$upstream:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /answer runs local LLM generation, which can take a long time on CPU or
        # for big models; allow up to 90 minutes before nginx returns a 504
        # gateway timeout on the upstream. Connect stays short (app is local).
        proxy_connect_timeout 10s;
        proxy_send_timeout 5400s;
        proxy_read_timeout 5400s;
    }

    # SPA fallback: real files win, everything else returns the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
